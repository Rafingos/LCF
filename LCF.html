<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Law of Hunting — Lout of Count's Family Pt2</title>
<!-- Supabase JS Client -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --paper:#FAF6EC;
    --ink:#000000;
    --ink-soft:#5c4545;
    --leather:#9e0000;
    --leather-deep:#700000;
    --gold:#a70000;
    --rule:#DCD0B8;
    --card:#FFFDF7;
    --danger:#A6432F;
    --shadow: 0 1px 0 rgba(43,36,28,.06);
    --radius: 3px;
  }

  body.theme-dark{
    --paper:#181510;
    --ink:#ffffff;
    --ink-soft:#b68a8a;
    --leather:#9e0000;
    --leather-deep:#700000;
    --gold:#a70000;
    --rule:#3A3225;
    --card:#211C15;
    --danger:#E0765F;
    --shadow: 0 1px 0 rgba(0,0,0,.4);
  }

  body.theme-sepia{
    --paper:#EFE0C0;
    --ink:#000000;
    --ink-soft:#774a4a;
    --leather:#9e0000;
    --leather-deep:#700000;
    --gold:#a70000;
    --rule:#D6C293;
    --card:#F7ECD3;
    --danger:#8c2424;
    --shadow: 0 1px 0 rgba(74,56,38,.12);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
    transition: background .35s ease, color .35s ease;
    min-height:100vh;
    padding-bottom:80px;
  }

  .display{
    font-family: Didot, "Bodoni MT", "Playfair Display", Georgia, serif;
    letter-spacing:.02em;
  }

  header.topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 28px 40px 18px;
    border-bottom: 1px solid var(--rule);
    max-width: 920px;
    margin: 0 auto;
  }

  .brand{
    display:flex;
    align-items:baseline;
    gap:14px;
  }
  .brand .mark{
    font-size:34px;
    font-weight:700;
    color: var(--leather);
  }
  .brand h1{
    font-size:22px;
    margin:0;
    font-weight:600;
    letter-spacing:.03em;
  }
  .brand .sub{
    color:var(--ink-soft);
    font-size:12.5px;
    letter-spacing:.14em;
    text-transform:uppercase;
    margin-top:2px;
  }

  .user-bar {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .user-info {
    font-size: 13px;
    color: var(--ink-soft);
    font-style: italic;
  }

  .theme-switch{
    display:flex;
    gap:6px;
    border:1px solid var(--rule);
    border-radius: 20px;
    padding:4px;
    background:var(--card);
  }
  .theme-switch button{
    width:34px;height:34px;
    border-radius:50%;
    border:none;
    background:transparent;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    font-size:15px;
    color:var(--ink-soft);
    transition: background .2s, color .2s;
  }
  .theme-switch button.active{
    background:var(--leather);
    color:var(--card);
  }
  .theme-switch button:hover:not(.active){
    color:var(--ink);
  }

  main{
    max-width: 920px;
    margin: 0 auto;
    padding: 32px 40px;
  }

  .toc-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom: 18px;
  }
  .toc-header .eyebrow{
    font-size:11px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }
  .toc-header h2{
    margin:2px 0 0;
    font-size:26px;
    font-weight:600;
  }

  .btn{
    font-family:inherit;
    cursor:pointer;
    border-radius:var(--radius);
    padding:10px 18px;
    font-size:13.5px;
    letter-spacing:.03em;
    border:1px solid var(--leather);
    background:transparent;
    color:var(--leather);
    transition: background .18s, color .18s, transform .05s;
  }
  .btn:hover{ background:var(--leather); color:var(--card); }
  .btn:active{ transform: translateY(1px); }

  .btn-solid{
    background:var(--leather);
    color:var(--card);
    border-color:var(--leather);
  }
  .btn-solid:hover{ background:var(--leather-deep); border-color:var(--leather-deep); }

  .btn-ghost{
    border-color: var(--rule);
    color:var(--ink-soft);
  }
  .btn-ghost:hover{ background:var(--rule); color:var(--ink); }

  .btn-danger{
    border-color:var(--danger);
    color:var(--danger);
  }
  .btn-danger:hover{ background:var(--danger); color:#fff; }

  .btn-sm{ padding:6px 12px; font-size:12px; }

  /* --- Modais e Form de Autenticação --- */
  .auth-overlay {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(0,0,0,0.65);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    backdrop-filter: blur(2px);
  }
  .auth-card {
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    padding: 32px 36px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
  }
  .auth-card h2 {
    margin: 0 0 8px;
    color: var(--leather);
    font-size: 24px;
  }
  .auth-card p {
    font-size: 13.5px;
    color: var(--ink-soft);
    margin: 0 0 20px;
  }
  .auth-field {
    margin-bottom: 16px;
  }
  .auth-field label {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .12em;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }
  .auth-field input {
    width: 100%;
    padding: 10px 12px;
    background: var(--paper);
    border: 1px solid var(--rule);
    color: var(--ink);
    border-radius: var(--radius);
    font-family: inherit;
    font-size: 14px;
    outline: none;
  }
  .auth-field input:focus {
    border-color: var(--leather);
  }
  .auth-actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 24px;
  }
  .auth-actions button {
    width: 100%;
  }
  .auth-switch-link {
    text-align: center;
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-top: 14px;
  }
  .auth-switch-link a {
    color: var(--leather);
    text-decoration: underline;
    cursor: pointer;
  }
  .auth-msg {
    margin-top: 12px;
    padding: 10px;
    border-radius: var(--radius);
    font-size: 12.5px;
    display: none;
  }
  .auth-msg.error {
    background: rgba(166, 67, 47, 0.1);
    color: var(--danger);
    border: 1px solid var(--danger);
  }
  .auth-msg.info {
    background: rgba(167, 0, 0, 0.08);
    color: var(--leather);
    border: 1px solid var(--rule);
  }

  /* --- Layout: sumário separado do painel de leitura --- */
  .library-layout{
    display:grid;
    grid-template-columns: 300px 1fr;
    gap: 28px;
    align-items: start;
  }

  /* --- Sumário (lista de capítulos) --- */
  .spine-list{
    list-style:none;
    margin:0; padding:0;
    border-top: 1px solid var(--rule);
  }
  .chapter{
    border-bottom: 1px solid var(--rule);
    background: var(--card);
    box-shadow: var(--shadow);
  }
  .chapter-head{
    display:flex;
    align-items:center;
    gap:14px;
    padding: 14px 16px;
    cursor:pointer;
    user-select:none;
  }
  .chapter-head .num{
    font-family:var(--display, inherit);
    font-size:12px;
    color:var(--gold);
    width:26px;
    flex-shrink:0;
    letter-spacing:.05em;
  }
  .chapter-head .title-block{ flex:1; min-width:0; }
  .chapter-head .title{
    font-size:15.5px;
    font-weight:600;
    color:var(--ink);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .chapter-head .meta{
    font-size:11px;
    color: var(--ink-soft);
    margin-top:2px;
    letter-spacing:.03em;
  }
  .chapter-head .chev{
    color:var(--leather);
    font-size:13px;
    transition: transform .2s ease, opacity .2s ease;
    flex-shrink:0;
    opacity:.55;
  }
  .chapter.active{
    background: var(--paper);
    box-shadow: inset 3px 0 0 var(--leather);
  }
  .chapter.active .chapter-head .chev{ transform: rotate(90deg); opacity:1; }
  .chapter.active .chapter-head .title{ color: var(--leather); }

  .chapter-actions{
    display:flex;
    gap:6px;
    flex-shrink:0;
  }

  /* --- Painel de leitura (independente da lista) --- */
  .reading-panel{
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    min-height: 420px;
    position: sticky;
    top: 20px;
  }
  .reading-panel-inner{
    padding: 30px 36px 36px;
  }
  .reading-topbar{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:16px;
    padding-bottom: 18px;
    margin-bottom: 18px;
    border-bottom: 1px dashed var(--rule);
  }
  .reading-topbar .chapter-title{
    font-size: 26px;
    font-weight:600;
    margin:0 0 4px;
    color:var(--ink);
  }
  .reading-topbar .meta{
    font-size:12px;
    color:var(--ink-soft);
    letter-spacing:.03em;
  }
  .reading-topbar .chapter-actions{ flex-shrink:0; padding-top:2px; }

  .reading-empty{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    min-height: 420px;
    color: var(--ink-soft);
    padding: 40px 30px;
  }
  .reading-empty .mark{ font-size:38px; color:var(--leather); margin-bottom:14px; }
  .reading-empty h3{ margin:0 0 6px; color:var(--ink); font-weight:600; }

  @media (max-width: 860px){
    .library-layout{ grid-template-columns: 1fr; }
    .reading-panel{ position: static; }
  }

  .reading-content{
    font-size:17px;
    line-height:1.85;
    color: var(--ink);
  }
  .reading-content p{ margin: 0 0 1em; }
  .reading-content h1,.reading-content h2,.reading-content h3{
    font-family: Didot, "Bodoni MT", "Playfair Display", Georgia, serif;
    color:var(--ink);
  }
  .reading-content blockquote{
    margin: 1em 0;
    padding: 6px 0 6px 16px;
    border-left: 3px solid var(--leather);
    color: var(--ink-soft);
    font-style: italic;
  }
  .reading-content a{ color: var(--leather); }
  .empty-note{
    color:var(--ink-soft);
    font-style:italic;
    font-size:14px;
  }

  /* --- Editor --- */
  .editor-wrap{ padding-top:10px; }
  .field-label{
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:6px;
    display:block;
  }
  input.title-input{
    width:100%;
    font-family: Didot, "Bodoni MT", "Playfair Display", Georgia, serif;
    font-size:22px;
    padding:8px 2px;
    border:none;
    border-bottom: 1px solid var(--rule);
    background:transparent;
    color:var(--ink);
    margin-bottom:18px;
    outline:none;
  }
  input.title-input:focus{ border-bottom-color: var(--leather); }

  .toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:4px;
    padding:8px;
    border:1px solid var(--rule);
    border-bottom:none;
    background: var(--paper);
    border-radius: var(--radius) var(--radius) 0 0;
  }
  .toolbar button{
    width:32px; height:30px;
    border:1px solid transparent;
    background:transparent;
    color:var(--ink);
    border-radius:3px;
    cursor:pointer;
    font-size:14px;
    font-family: Georgia, serif;
  }
  .toolbar button:hover{ background:var(--rule); }
  .toolbar .sep{
    width:1px;
    background:var(--rule);
    margin:3px 5px;
  }

  .rte{
    min-height:260px;
    max-height:520px;
    overflow-y:auto;
    border:1px solid var(--rule);
    border-radius: 0 0 var(--radius) var(--radius);
    padding:16px 18px;
    background:var(--card);
    font-size:16.5px;
    line-height:1.8;
    outline:none;
  }
  .rte:empty:before{
    content: attr(data-placeholder);
    color: var(--ink-soft);
    font-style:italic;
  }
  .rte blockquote{
    margin: 1em 0;
    padding: 4px 0 4px 14px;
    border-left: 3px solid var(--leather);
    color: var(--ink-soft);
    font-style:italic;
  }

  .editor-footer{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:16px;
  }

  .empty-state{
    text-align:center;
    padding: 60px 20px;
    color: var(--ink-soft);
  }
  .empty-state .mark{ font-size:40px; color:var(--leather); display:block; margin-bottom:14px; }
  .empty-state h3{ margin:0 0 6px; color:var(--ink); font-weight:600; }

  .loading-note{
    text-align:center;
    padding: 40px;
    color: var(--ink-soft);
    font-style: italic;
  }

  .admin-only {
    display: none !important;
  }

  ::-webkit-scrollbar{ width:9px; }
  ::-webkit-scrollbar-thumb{ background: var(--rule); border-radius:6px; }

  @media (max-width:640px){
    header.topbar, main{ padding-left:18px; padding-right:18px; }
    .reading-panel-inner{ padding: 22px 20px 28px; }
    .chapter-head .num{ display:none; }
  }
</style>
</head>
<body class="theme-light">

<!-- Modal de Autenticação (Login / Cadastro) -->
<div class="auth-overlay" id="authOverlay">
  <div class="auth-card">
    <h2 class="display" id="authTitle">Entrar na Biblioteca</h2>
    <p id="authSubtitle">Identifique-se para acessar o acervo privado.</p>
    
    <div class="auth-field">
      <label for="authEmail">E-mail</label>
      <input type="email" id="authEmail" placeholder="seu@email.com" autocomplete="email">
    </div>
    
    <div class="auth-field">
      <label for="authPassword">Senha</label>
      <input type="password" id="authPassword" placeholder="••••••••" autocomplete="current-password">
    </div>

    <div class="auth-msg" id="authMsg"></div>

    <div class="auth-actions">
      <button class="btn btn-solid" id="authSubmitBtn">Entrar</button>
    </div>

    <div class="auth-switch-link">
      <span id="authSwitchText">Não tem uma conta?</span>
      <a id="authSwitchBtn">Criar conta</a>
    </div>
  </div>
</div>

<header class="topbar">
  <div class="brand">
    <span class="mark display">§</span>
    <div>
      <h1 class="display">Law of Hunting</h1>
      <div class="sub">Lout of Count's Family Pt2</div>
    </div>
  </div>
  
  <div class="user-bar">
    <span class="user-info" id="userInfo"></span>
    <button class="btn btn-ghost btn-sm" id="logoutBtn" style="display:none;">Sair</button>
    <div class="theme-switch" role="group" aria-label="Modo de leitura">
      <button data-theme="light" title="Papel claro" aria-label="Papel claro">☀</button>
      <button data-theme="sepia" title="Sépia" aria-label="Sépia">◐</button>
      <button data-theme="dark" title="Tinta noturna" aria-label="Tinta noturna">☾</button>
    </div>
  </div>
</header>

<main>
  <div class="toc-header">
    <div>
      <div class="eyebrow">Sumário</div>
      <h2 class="display" id="chapterCount">Capítulos</h2>
    </div>
    <div style="display:flex; gap:10px;">
      <button class="btn btn-ghost" id="exportBtn" title="Baixar todos os capítulos em um backup compactado">⇩ Exportar backup</button>
      <button class="btn btn-ghost admin-only" id="importBtn" title="Importar capítulos de um arquivo de backup (.json ou .json.gz)">⇪ Importar backup</button>
      <input type="file" id="importFileInput" accept="application/json,.json,.gz,.json.gz" style="display:none">
      <button class="btn btn-solid admin-only" id="newChapterBtn">＋ Novo capítulo</button>
    </div>
  </div>
  <div id="importStatus" style="display:none; margin:-6px 0 18px; font-size:13px; color:var(--ink-soft); font-style:italic;"></div>

  <div class="library-layout">
    <aside class="toc-panel">
      <div id="listContainer">
        <div class="loading-note">Autenticando na biblioteca…</div>
      </div>
    </aside>
    <section class="reading-panel" id="readingPanel">
      <div class="reading-empty">
        <span class="mark display">✒</span>
        <h3>Nenhum capítulo aberto</h3>
        <p>Selecione um capítulo ao lado para ler ou editar.</p>
      </div>
    </section>
  </div>
</main>

<script>
(function(){
  // CONFIGURAÇÃO DO SUPABASE — Substitua com suas credenciais do painel (Project Settings > API)
  const SUPABASE_URL = 'HTTPS://SEU-PROJETO.supabase.co';
  const SUPABASE_KEY = 'SUA-CHAVE-ANON-PUBLIC';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const THEME_KEY = 'encadernado_law_of_hunting__theme';
  let chapters = [];
  let openId = null;      // capítulo atualmente aberto
  let editingId = null;   // null | 'new' | id do capítulo em edição
  let ready = false;
  let currentUser = null;
  let currentProfile = null;
  let isAuthModeLogin = true;

  // DOM Elements
  const authOverlay = document.getElementById('authOverlay');
  const authTitle = document.getElementById('authTitle');
  const authSubtitle = document.getElementById('authSubtitle');
  const authEmail = document.getElementById('authEmail');
  const authPassword = document.getElementById('authPassword');
  const authSubmitBtn = document.getElementById('authSubmitBtn');
  const authSwitchBtn = document.getElementById('authSwitchBtn');
  const authSwitchText = document.getElementById('authSwitchText');
  const authMsg = document.getElementById('authMsg');
  const userInfo = document.getElementById('userInfo');
  const logoutBtn = document.getElementById('logoutBtn');

  const listContainer = document.getElementById('listContainer');
  const readingPanel = document.getElementById('readingPanel');
  const chapterCountEl = document.getElementById('chapterCount');
  const newChapterBtn = document.getElementById('newChapterBtn');
  const importBtn = document.getElementById('importBtn');

  // ---------- Tema ----------
  function loadTheme(){
    let theme = 'light';
    try{
      const saved = localStorage.getItem(THEME_KEY);
      if(saved) theme = saved;
    }catch(e){}
    applyTheme(theme, false);
  }
  function applyTheme(theme, persist){
    document.body.className = 'theme-' + theme;
    document.querySelectorAll('.theme-switch button').forEach(b=>{
      b.classList.toggle('active', b.dataset.theme === theme);
    });
    if(persist){
      try{ localStorage.setItem(THEME_KEY, theme); }catch(e){}
    }
  }
  document.querySelectorAll('.theme-switch button').forEach(btn=>{
    btn.addEventListener('click', ()=> applyTheme(btn.dataset.theme, true));
  });

  // ---------- Autenticação / Supabase Auth ----------
  function showAuthMessage(msg, isError = false) {
    authMsg.textContent = msg;
    authMsg.className = 'auth-msg ' + (isError ? 'error' : 'info');
    authMsg.style.display = 'block';
  }

  function clearAuthMessage() {
    authMsg.style.display = 'none';
    authMsg.textContent = '';
  }

  authSwitchBtn.addEventListener('click', () => {
    isAuthModeLogin = !isAuthModeLogin;
    clearAuthMessage();
    if(isAuthModeLogin) {
      authTitle.textContent = 'Entrar na Biblioteca';
      authSubtitle.textContent = 'Identifique-se para acessar o acervo privado.';
      authSubmitBtn.textContent = 'Entrar';
      authSwitchText.textContent = 'Não tem uma conta?';
      authSwitchBtn.textContent = 'Criar conta';
    } else {
      authTitle.textContent = 'Criar Conta';
      authSubtitle.textContent = 'Cadastre-se para solicitar acesso à leitura.';
      authSubmitBtn.textContent = 'Solicitar Cadastro';
      authSwitchText.textContent = 'Já possui uma conta?';
      authSwitchBtn.textContent = 'Fazer Login';
    }
  });

  authSubmitBtn.addEventListener('click', handleAuthSubmit);

  async function handleAuthSubmit() {
    const email = authEmail.value.trim();
    const password = authPassword.value;

    if(!email || !password) {
      showAuthMessage('Por favor, preencha o e-mail e a senha.', true);
      return;
    }

    authSubmitBtn.disabled = true;
    clearAuthMessage();

    try {
      if(isAuthModeLogin) {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if(error) throw error;
        checkUserSession();
      } else {
        const { data, error } = await supabase.auth.signUp({ email, password });
        if(error) throw error;
        showAuthMessage('Solicitação enviada com sucesso! Aguarde a aprovação do administrador para poder entrar.');
        authEmail.value = '';
        authPassword.value = '';
      }
    } catch(err) {
      showAuthMessage(err.message || 'Ocorreu um erro na autenticação.', true);
    } finally {
      authSubmitBtn.disabled = false;
    }
  }

  logoutBtn.addEventListener('click', async () => {
    await supabase.auth.signOut();
    location.reload();
  });

  async function checkUserSession() {
    const { data: { session } } = await supabase.auth.getSession();
    
    if(!session) {
      authOverlay.style.display = 'flex';
      listContainer.innerHTML = '<div class="loading-note">Aguardando login…</div>';
      return;
    }

    currentUser = session.user;

    // Buscar status de aprovação e perfil
    const { data: profile, error } = await supabase
      .from('profiles')
      .select('is_approved, role')
      .eq('id', currentUser.id)
      .single();

    if (error || !profile) {
      showAuthMessage('Erro ao carregar seu perfil. Tente novamente.', true);
      await supabase.auth.signOut();
      return;
    }

    if (!profile.is_approved) {
      authOverlay.style.display = 'flex';
      showAuthMessage('Sua conta ainda não foi aprovada pelo administrador. Aguarde a liberação.', false);
      await supabase.auth.signOut();
      return;
    }

    currentProfile = profile;
    authOverlay.style.display = 'none';

    // Atualiza barra superior
    userInfo.textContent = currentUser.email + (profile.role === 'admin' ? ' (Admin)' : '');
    logoutBtn.style.display = 'inline-block';

    // Exibir recursos de admin se aplicável
    if(profile.role === 'admin') {
      document.querySelectorAll('.admin-only').forEach(el => el.classList.remove('admin-only'));
    }

    loadChaptersFromSupabase();
  }

  // ---------- Dados do Supabase ----------
  async function loadChaptersFromSupabase() {
    listContainer.innerHTML = '<div class="loading-note">Carregando acervo do banco de dados…</div>';
    
    const { data, error } = await supabase
      .from('chapters')
      .select('*')
      .order('created_at', { ascending: true });

    if(error) {
      console.error(error);
      listContainer.innerHTML = '<div class="loading-note">Erro ao carregar capítulos.</div>';
      return;
    }

    chapters = (data || []).map(c => ({
      id: c.id,
      title: c.title,
      content: c.content,
      createdAt: c.created_at,
      updatedAt: c.updated_at
    }));

    ready = true;
    render();
  }

  function formatDate(iso){
    if(!iso) return '';
    const d = new Date(iso);
    return d.toLocaleDateString('pt-BR', { day:'2-digit', month:'short', year:'numeric' });
  }

  function plainPreview(html){
    const tmp = document.createElement('div');
    tmp.innerHTML = html || '';
    const text = (tmp.textContent || '').trim();
    return text.length > 0;
  }

  // ---------- Render ----------
  function render(){
    renderTocList();
    renderReadingPanel();
  }

  function renderTocList(){
    if(!ready){
      listContainer.innerHTML = '<div class="loading-note">Abrindo o volume…</div>';
      return;
    }

    chapterCountEl.textContent = chapters.length === 1 ? '1 capítulo' : chapters.length + ' capítulos';

    if(chapters.length === 0){
      listContainer.innerHTML = `
        <div class="empty-state">
          <span class="mark display">✒</span>
          <h3>Ainda não há capítulos</h3>
          <p>Nenhum texto publicado até o momento.</p>
        </div>`;
      return;
    }

    const ul = document.createElement('ul');
    ul.className = 'spine-list';

    chapters.forEach((ch, idx) => {
      ul.appendChild(buildTocItem(ch, idx));
    });

    listContainer.innerHTML = '';
    listContainer.appendChild(ul);
  }

  function buildTocItem(ch, idx){
    const li = document.createElement('li');
    const isActive = (openId === ch.id) || (editingId === ch.id);
    li.className = 'chapter' + (isActive ? ' active' : '');

    const head = document.createElement('div');
    head.className = 'chapter-head';
    head.innerHTML = `
      <span class="chev">❯</span>
      <span class="num">${String(idx+1).padStart(2,'0')}</span>
      <span class="title-block">
        <div class="title">${escapeHtml(ch.title || 'Sem título')}</div>
        <div class="meta">Atualizado em ${formatDate(ch.updatedAt)}</div>
      </span>
    `;
    
    if(currentProfile && currentProfile.role === 'admin') {
      const actions = document.createElement('div');
      actions.className = 'chapter-actions';
      actions.innerHTML = `
        <button class="btn btn-ghost btn-sm" data-act="edit">Editar</button>
        <button class="btn btn-danger btn-sm" data-act="delete">Excluir</button>
      `;
      head.appendChild(actions);

      actions.querySelector('[data-act="edit"]').addEventListener('click', (e)=>{
        e.stopPropagation();
        editingId = ch.id;
        openId = ch.id;
        render();
      });
      actions.querySelector('[data-act="delete"]').addEventListener('click', async (e)=>{
        e.stopPropagation();
        if(confirm(`Excluir o capítulo "${ch.title || 'sem título'}"? Essa ação não pode ser desfeita.`)){
          const { error } = await supabase.from('chapters').delete().eq('id', ch.id);
          if(!error) {
            if(openId === ch.id) openId = null;
            if(editingId === ch.id) editingId = null;
            await loadChaptersFromSupabase();
          } else {
            alert('Erro ao excluir do Supabase: ' + error.message);
          }
        }
      });
    }

    head.addEventListener('click', (e)=>{
      if(e.target.closest('[data-act]')) return;
      if(editingId && editingId !== ch.id){
        editingId = null;
      }
      openId = (openId === ch.id && editingId !== ch.id) ? null : ch.id;
      render();
    });

    li.appendChild(head);
    return li;
  }

  // ---------- Painel de leitura ----------
  function renderReadingPanel(){
    readingPanel.innerHTML = '';

    if(editingId === 'new'){
      readingPanel.appendChild(buildEditorPanel(null));
      return;
    }
    if(editingId){
      const chEdit = chapters.find(c => c.id === editingId);
      if(chEdit){
        readingPanel.appendChild(buildEditorPanel(chEdit));
        return;
      }
      editingId = null;
    }

    if(openId){
      const chOpen = chapters.find(c => c.id === openId);
      if(chOpen){
        readingPanel.appendChild(buildReadingView(chOpen));
        return;
      }
      openId = null;
    }

    readingPanel.innerHTML = `
      <div class="reading-empty">
        <span class="mark display">✒</span>
        <h3>Nenhum capítulo aberto</h3>
        <p>Selecione um capítulo ao lado para ler.</p>
      </div>`;
  }

  function buildReadingView(ch){
    const wrap = document.createElement('div');
    wrap.className = 'reading-panel-inner';

    const top = document.createElement('div');
    top.className = 'reading-topbar';
    top.innerHTML = `
      <div>
        <h2 class="chapter-title display">${escapeHtml(ch.title || 'Sem título')}</h2>
        <div class="meta">Atualizado em ${formatDate(ch.updatedAt)}</div>
      </div>
      <div class="chapter-actions">
        ${currentProfile && currentProfile.role === 'admin' ? '<button class="btn btn-ghost btn-sm" data-act="edit">Editar</button><button class="btn btn-danger btn-sm" data-act="delete">Excluir</button>' : ''}
        <button class="btn btn-ghost btn-sm" data-act="close">Fechar</button>
      </div>
    `;

    if(currentProfile && currentProfile.role === 'admin') {
      top.querySelector('[data-act="edit"]').addEventListener('click', ()=>{
        editingId = ch.id;
        render();
      });
      top.querySelector('[data-act="delete"]').addEventListener('click', async ()=>{
        if(confirm(`Excluir o capítulo "${ch.title || 'sem título'}"? Essa ação não pode ser desfeita.`)){
          const { error } = await supabase.from('chapters').delete().eq('id', ch.id);
          if(!error) {
            openId = null;
            await loadChaptersFromSupabase();
          } else {
            alert('Erro ao excluir: ' + error.message);
          }
        }
      });
    }

    top.querySelector('[data-act="close"]').addEventListener('click', ()=>{
      openId = null;
      render();
    });

    const content = document.createElement('div');
    if(plainPreview(ch.content)){
      content.innerHTML = `<div class="reading-content">${ch.content}</div>`;
    } else {
      content.innerHTML = `<div class="empty-note">Este capítulo ainda não tem texto.</div>`;
    }

    wrap.appendChild(top);
    wrap.appendChild(content);
    return wrap;
  }

  function buildEditorPanel(ch){
    const isNew = !ch;
    const wrap = document.createElement('div');
    wrap.className = 'reading-panel-inner editor-wrap';

    const titleId = 'title_' + (isNew ? 'new' : ch.id);
    const rteId = 'rte_' + (isNew ? 'new' : ch.id);

    wrap.innerHTML = `
      <div class="reading-topbar" style="border-bottom:none; margin-bottom:6px; padding-bottom:0;">
        <div><h2 class="chapter-title display">${isNew ? 'Novo capítulo' : 'Editando capítulo'}</h2></div>
      </div>
      <span class="field-label">Título do capítulo</span>
      <input type="text" class="title-input" id="${titleId}" placeholder="Ex.: Capítulo 1 — O começo" value="${isNew ? '' : escapeAttr(ch.title || '')}" />

      <span class="field-label">Texto</span>
      <div class="toolbar" data-target="${rteId}">
        <button type="button" data-cmd="bold" title="Negrito"><b>B</b></button>
        <button type="button" data-cmd="italic" title="Itálico"><i>I</i></button>
        <button type="button" data-cmd="underline" title="Sublinhado"><u>S</u></button>
        <button type="button" data-cmd="strikeThrough" title="Tachado"><s>T</s></button>
        <div class="sep"></div>
        <button type="button" data-cmd="formatBlock" data-val="H1" title="Título 1">H1</button>
        <button type="button" data-cmd="formatBlock" data-val="H2" title="Título 2">H2</button>
        <button type="button" data-cmd="formatBlock" data-val="P" title="Parágrafo">¶</button>
        <button type="button" data-cmd="formatBlock" data-val="BLOCKQUOTE" title="Citação">❝</button>
        <div class="sep"></div>
        <button type="button" data-cmd="insertUnorderedList" title="Lista">•—</button>
        <button type="button" data-cmd="insertOrderedList" title="Lista numerada">1.</button>
        <div class="sep"></div>
        <button type="button" data-cmd="createLink" title="Inserir link">🔗</button>
        <button type="button" data-cmd="removeFormat" title="Limpar formatação">⌫</button>
        <div class="sep"></div>
        <button type="button" data-cmd="undo" title="Desfazer">↺</button>
        <button type="button" data-cmd="redo" title="Refazer">↻</button>
      </div>
      <div class="rte" id="${rteId}" contenteditable="true" data-placeholder="Escreva o capítulo aqui...">${isNew ? '' : (ch.content || '')}</div>

      <div class="editor-footer">
        <button class="btn btn-ghost" data-act="cancel">Cancelar</button>
        <button class="btn btn-solid" data-act="save">Salvar capítulo</button>
      </div>
    `;

    wrap.querySelectorAll('.toolbar button').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const rte = document.getElementById(rteId);
        rte.focus();
        const cmd = btn.dataset.cmd;
        if(cmd === 'createLink'){
          const url = prompt('Endereço do link (https://...)');
          if(url) document.execCommand('createLink', false, url);
        } else if(cmd === 'formatBlock'){
          document.execCommand('formatBlock', false, btn.dataset.val);
        } else {
          document.execCommand(cmd, false, null);
        }
      });
    });

    wrap.querySelector('[data-act="cancel"]').addEventListener('click', ()=>{
      editingId = null;
      render();
    });

    wrap.querySelector('[data-act="save"]').addEventListener('click', async ()=>{
      const titleVal = document.getElementById(titleId).value.trim();
      const contentVal = document.getElementById(rteId).innerHTML;

      if(!titleVal){
        alert('Dê um título ao capítulo antes de salvar.');
        document.getElementById(titleId).focus();
        return;
      }

      const saveBtn = wrap.querySelector('[data-act="save"]');
      saveBtn.disabled = true;
      saveBtn.textContent = 'Salvando no banco…';

      const nowIso = new Date().toISOString();

      if(isNew){
        const { data, error } = await supabase
          .from('chapters')
          .insert([{ title: titleVal, content: contentVal, created_at: nowIso, updated_at: nowIso }])
          .select()
          .single();

        if(error) {
          alert('Erro ao salvar no banco de dados: ' + error.message);
          saveBtn.disabled = false;
          saveBtn.textContent = 'Salvar capítulo';
          return;
        }
        openId = data.id;
      } else {
        const { error } = await supabase
          .from('chapters')
          .update({ title: titleVal, content: contentVal, updated_at: nowIso })
          .eq('id', ch.id);

        if(error) {
          alert('Erro ao atualizar no banco de dados: ' + error.message);
          saveBtn.disabled = false;
          saveBtn.textContent = 'Salvar capítulo';
          return;
        }
        openId = ch.id;
      }

      editingId = null;
      await loadChaptersFromSupabase();
    });

    return wrap;
  }

  // ---------- Compactação & Backup ----------
  const supportsCompression = typeof CompressionStream !== 'undefined' && typeof DecompressionStream !== 'undefined';

  async function gzipCompress(text){
    const stream = new Blob([text]).stream().pipeThrough(new CompressionStream('gzip'));
    const buf = await new Response(stream).arrayBuffer();
    return new Uint8Array(buf);
  }
  async function gzipDecompress(uint8arr){
    const stream = new Blob([uint8arr]).stream().pipeThrough(new DecompressionStream('gzip'));
    const buf = await new Response(stream).arrayBuffer();
    return new TextDecoder('utf-8').decode(buf);
  }
  function looksGzipped(bytes){
    return bytes.length > 2 && bytes[0] === 0x1f && bytes[1] === 0x8b;
  }
  function formatBytes(n){
    if(n < 1024) return n + ' B';
    if(n < 1024*1024) return (n/1024).toFixed(1) + ' KB';
    return (n/1024/1024).toFixed(2) + ' MB';
  }

  function minifyHtml(html){
    if(!html) return '';
    return html
      .replace(/<p>(\s|&nbsp;|<br\s*\/?>)*<\/p>/gi, '')
      .replace(/>\s+</g, '><')
      .trim();
  }

  function showStatus(msg){
    importStatus.style.display = 'block';
    importStatus.textContent = msg;
    setTimeout(()=>{ importStatus.style.display = 'none'; }, 7000);
  }

  const exportBtn = document.getElementById('exportBtn');
  exportBtn.addEventListener('click', async ()=>{
    if(chapters.length === 0){
      alert('Ainda não há capítulos para exportar.');
      return;
    }
    exportBtn.disabled = true;
    const originalLabel = exportBtn.textContent;
    exportBtn.textContent = 'Compactando…';
    try{
      const backupData = chapters.map(c => ({
        id: c.id,
        title: c.title,
        content: minifyHtml(c.content)
      }));
      const jsonStr = JSON.stringify(backupData);
      const rawSize = new Blob([jsonStr]).size;

      const dateStr = new Date().toISOString().slice(0,10);
      let blob, filename;

      if(supportsCompression){
        const gz = await gzipCompress(jsonStr);
        blob = new Blob([gz], { type: 'application/gzip' });
        filename = `encadernado-backup-${dateStr}.json.gz`;
        showStatus(`Backup exportado e compactado: ${formatBytes(rawSize)} → ${formatBytes(blob.size)} (${Math.round((1 - blob.size/rawSize)*100)}% menor).`);
      } else {
        blob = new Blob([jsonStr], { type: 'application/json' });
        filename = `encadernado-backup-${dateStr}.json`;
        showStatus(`Backup exportado: ${formatBytes(blob.size)}. (Compactação não suportada neste navegador.)`);
      }

      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }catch(err){
      console.error(err);
      alert('Não foi possível gerar o backup.');
    }finally{
      exportBtn.disabled = false;
      exportBtn.textContent = originalLabel;
    }
  });

  const importFileInput = document.getElementById('importFileInput');
  const importStatus = document.getElementById('importStatus');

  importBtn.addEventListener('click', ()=> importFileInput.click());

  importFileInput.addEventListener('change', (e)=>{
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = async (ev)=>{
      try{
        const bytes = new Uint8Array(ev.target.result);
        let text;
        if(looksGzipped(bytes)){
          if(!supportsCompression){
            alert('Navegador não suporta descompactação gzip.');
            return;
          }
          text = await gzipDecompress(bytes);
        } else {
          text = new TextDecoder('utf-8').decode(bytes);
        }
        const raw = JSON.parse(text);
        const list = Array.isArray(raw) ? raw : (Array.isArray(raw.chapters) ? raw.chapters : null);
        if(!list) throw new Error('Formato inesperado');
        importChaptersToSupabase(list);
      }catch(err){
        console.error(err);
        alert('Não foi possível ler esse arquivo de backup.');
      }
    };
    reader.readAsArrayBuffer(file);
    importFileInput.value = '';
  });

  async function importChaptersToSupabase(rawList) {
    showStatus('Importando capítulos para o banco de dados...');
    let added = 0;
    
    for(const item of rawList) {
      const title = (item.title || 'Sem título').trim();
      const content = item.content || '';
      
      const { error } = await supabase.from('chapters').insert([{ title, content }]);
      if(!error) added++;
    }

    showStatus(`Importação concluída: ${added} capítulo(s) adicionados ao banco de dados.`);
    await loadChaptersFromSupabase();
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }
  function escapeAttr(str){
    return escapeHtml(str);
  }

  newChapterBtn.addEventListener('click', ()=>{
    editingId = 'new';
    openId = null;
    render();
    setTimeout(()=>{
      const el = document.getElementById('title_new');
      if(el) el.focus();
    }, 50);
  });

  loadTheme();
  checkUserSession();
})();
</script>

</body>
